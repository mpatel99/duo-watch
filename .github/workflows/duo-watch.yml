name: iPhone Duo stock watch

on:
  # schedule disabled: Apple blocks GitHub runner IPs (HTTP 541)
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:        # "Run workflow" button for manual tests

concurrency:
  group: duo-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Remember what we already alerted on, so you get one push per restock
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: .duo_watch_state.json
          key: duo-state-${{ github.run_id }}
          restore-keys: duo-state-

      - name: Check Apple pickup availability near 07094
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 duo_watch.py --once

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .duo_watch_state.json
          key: duo-state-${{ github.run_id }}
